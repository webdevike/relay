name: desktop

# Relay desktop (apps/desktop + the @evaos/* packages): the checks of scripts/gate.sh that need no
# display. The app has its own pnpm workspace (pnpm 12, isolated) and links Relay packages from the
# root install (pnpm 9, hoisted) and from packages/widget-runtime's own install.
on:
  push:
    paths:
      [
        "apps/desktop/**",
        "packages/browser-core/**",
        "packages/chat-core/**",
        "packages/contract/**",
        "packages/eva-core/**",
        "packages/shell-core/**",
        "packages/portrait-motion/**",
        "packages/slack-emoji/**",
        "packages/widget-runtime/**",
        "scripts/**",
        "fixtures/**",
        ".oxlintrc.json",
        ".oxfmtrc.json",
        "tooling/oxlint-config/**",
        "stylelint.config.mjs",
        "tsconfig.desktop.json",
        "pnpm-lock.yaml",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "apps/desktop/**",
        "packages/browser-core/**",
        "packages/chat-core/**",
        "packages/contract/**",
        "packages/eva-core/**",
        "packages/shell-core/**",
        "packages/portrait-motion/**",
        "packages/slack-emoji/**",
        "packages/widget-runtime/**",
        "scripts/**",
        "fixtures/**",
        ".oxlintrc.json",
        ".oxfmtrc.json",
        "tooling/oxlint-config/**",
        "stylelint.config.mjs",
        "tsconfig.desktop.json",
        "pnpm-lock.yaml",
        ".github/workflows/desktop.yml",
      ]

jobs:
  check:
    # Nothing here needs a display or macOS; macOS arm64 runners are capacity-constrained and jobs
    # sat unacquired for 15 min then cancelled.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm 10+ switches to each workspace's packageManager version (root 9.15.0, desktop 12.11.2).
      # Bootstrap with desktop's version, read from its packageManager (no `version:` input, which
      # conflicts with the root package.json's packageManager).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          # pnpm 12 fails on unreviewed build scripts; widget-runtime has no workspace file to allow esbuild.
          (cd packages/widget-runtime && pnpm install --frozen-lockfile --ignore-workspace --allow-build=esbuild)
          (cd apps/desktop && pnpm install --frozen-lockfile)
          # Electron 44 has no postinstall: fetch its binary.
          (cd apps/desktop/node_modules/electron && node install.js)
      # TypeScript 7 (native tsc). `tsc6` (typecheck:tsc6) is the TypeScript 6 fallback.
      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm -r --include-workspace-root typecheck
      - name: Lint (oxlint, oxfmt, em-dash, spacing)
        working-directory: apps/desktop
        run: pnpm lint
      - name: Unit tests
        working-directory: apps/desktop
        run: pnpm -r --include-workspace-root test
      - name: Build
        working-directory: apps/desktop
        run: pnpm build
