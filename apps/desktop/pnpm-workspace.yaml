# Relay desktop's own install (outside the root workspace, see ../../pnpm-workspace.yaml): the app
# and its packages, isolated linker, pnpm from this package.json. @relay/* packages are linked from
# the root workspace, so a build needs the root install too.
packages:
  - '.'
  - '../../packages/browser-core'
  - '../../packages/chat-core'
  - '../../packages/contract'
  - '../../packages/eva-core'
  - '../../packages/shell-core'
allowBuilds:
  electron-winstaller: false
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - electron-vite@6.0.0
  - playwright-core@1.64.1
  - playwright@1.64.1
  - react-dom@19.3.1
  - react@19.3.1
  - react-is@19.3.1
