appId: dev.eva.relay-desktop
productName: Relay
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/**
  - '!resources/RelayHost/**'
# The setup wizard's shell scripts run with bash, so they ship as real files: Relay.app/Contents/Resources/setup.
# RelayHost is a prebuilt, already signed "Relay Host.app" copied in by scripts/package-onboarding.sh.
extraResources:
  - from: resources/setup
    to: setup
  - from: resources/RelayHost
    to: RelayHost
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/electron-chrome-extensions/**'
npmRebuild: false
# relay:// deep links (relay://open/settings/connections, relay://assistant/nova) open in Relay:
# Info.plist CFBundleURLTypes; main/deep-links.ts takes macOS's open-url.
protocols:
  - name: Relay
    schemes:
      - relay
mac:
  icon: resources/icon.icns
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  artifactName: Relay-${version}-${arch}.${ext}
  # A real signature carries the bundle id; macOS drops notifications from the ad-hoc "Electron" one.
  identity: 'Apple Development: Created via API (9KJ57Q4A39)'
  hardenedRuntime: false
  gatekeeperAssess: false
  # Relay Assist and Relay Meetings (Contents/Helpers, started by Relay) ask for these under Relay's
  # name: macOS reads the reason from the responsible app, which is Relay. Without
  # NSAudioCaptureUsageDescription the meeting tap records silence and macOS reports no error.
  extendInfo:
    NSMicrophoneUsageDescription: Relay listens while you talk to your assistants, in a call or while you hold the Assist talk key, and records your side of your meetings.
    NSAudioCaptureUsageDescription: Relay records the call audio of your meetings so it can transcribe them.
    NSScreenCaptureUsageDescription: Relay Assist looks at the window you ask about so your assistant can point at the right control.
    NSAccessibilityUsageDescription: Relay Assist reads the names and positions of controls in the window you ask about.
