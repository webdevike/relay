appId: dev.eva.relay-desktop
productName: Relay
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/**
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/electron-chrome-extensions/**'
npmRebuild: false
mac:
  icon: resources/icon.icns
  target:
    - target: dir
      arch: arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
