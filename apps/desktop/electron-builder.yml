appId: dev.eva.relay-desktop
productName: Relay
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/**
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/electron-chrome-extensions/**'
npmRebuild: false
mac:
  icon: resources/icon.icns
  target:
    - target: dir
      arch: arm64
  # A real signature carries the bundle id; macOS drops notifications from the ad-hoc "Electron" one.
  identity: 'Apple Development: Created via API (9KJ57Q4A39)'
  hardenedRuntime: false
  gatekeeperAssess: false
  # Relay Assist (Contents/Helpers, started by Relay) asks for these under Relay's name: macOS
  # reads the reason from the responsible app, which is Relay.
  extendInfo:
    NSMicrophoneUsageDescription: Relay listens while you talk to your assistants, in a call or while you hold the Assist talk key.
    NSScreenCaptureUsageDescription: Relay Assist looks at the window you ask about so your assistant can point at the right control.
    NSAccessibilityUsageDescription: Relay Assist reads the names and positions of controls in the window you ask about.
