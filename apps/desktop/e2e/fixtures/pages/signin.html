<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
    <style>
      body {
        margin: 0;
        font: 16px system-ui;
        background: linear-gradient(135deg, #e0f2fe, #fce7f3);
        min-height: 100vh;
      }
      #signin {
        margin: 40px;
        width: 240px;
        height: 60px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <button id="signin">Sign in with Provider</button>
    <p id="result">waiting</p>
    <script>
      // The OAuth popup contract: the provider window posts the result to window.opener and
      // closes itself.
      window.addEventListener('message', (e) => {
        if (e.origin === location.origin) {
          document.getElementById('result').textContent = 'signed in: ' + e.data.code
        }
      })
      document.getElementById('signin').addEventListener('click', () => {
        window.__popup = window.open('/provider.html', 'provider', 'width=420,height=560')
      })
    </script>
  </body>
</html>
