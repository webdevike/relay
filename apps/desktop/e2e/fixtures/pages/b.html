<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Page B</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        font-family: sans-serif;
        color: #fff;
        background: linear-gradient(45deg, #222266, #cc6633 60%, #eecc33);
      }
      body {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <h1 id="text">PAGE B TEXT</h1>
    <button
      id="btn"
      onclick="
        document.body.dataset.clicked = 'yes'
        document.getElementById('text').textContent = 'CLICKED'
      "
    >
      Click me
    </button>
  </body>
</html>
