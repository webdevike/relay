<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Design fixture</title>
    <style>
      body {
        margin: 0;
        font: 15px/1.4 -apple-system, system-ui, sans-serif;
        background: #f6f7f9;
        color: #1f2328;
      }
      main {
        padding: 32px;
      }
      .card {
        max-width: 420px;
        padding: 20px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #d8dde3;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .card p {
        margin: 0 0 16px;
        color: #57606a;
      }
      button.primary {
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: #2f6feb;
        color: #fff;
        font: 600 14px/1 system-ui, sans-serif;
      }
      .spacer {
        height: 1600px;
      }
    </style>
  </head>
  <body>
    <main>
      <div
        class="card"
        data-inspector-relative-path="src/components/Card.tsx"
        data-inspector-line="7"
        data-component="Card"
      >
        <h2>Monthly plan</h2>
        <p>Everything you need to send cards to your team.</p>
        <button class="primary" id="save" type="button">Save changes</button>
      </div>
      <div class="spacer"></div>
    </main>
    <script>
      // Clicks that reach the page (Design Mode must keep them out).
      window.clicks = 0
      // A React 18 dev build keeps its fiber on the DOM node: the button's carries the JSX source,
      // its owner is the SaveButton component.
      function SaveButton() {}
      function wire() {
        const save = document.getElementById('save')
        save.addEventListener('click', () => window.clicks++)
        save['__reactFiber$fixture'] = {
          type: 'button',
          _debugSource: {
            fileName: 'src/components/SaveButton.tsx',
            lineNumber: 12,
            columnNumber: 5,
          },
          _debugOwner: { type: SaveButton, return: null },
          return: { type: SaveButton, return: null },
        }
      }
      wire()
      // A hot update: the card is rendered again as a new node with the agent's change applied.
      window.hotSwap = (padding) => {
        const old = document.querySelector('.card')
        const next = old.cloneNode(true)
        next.style.padding = padding
        old.replaceWith(next)
        wire()
      }
    </script>
  </body>
</html>
