<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Design cards</title>
    <style>
      body {
        margin: 0;
        font:
          15px/1.4 -apple-system,
          system-ui,
          sans-serif;
        background: #f6f7f9;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 180px);
        gap: 16px;
        padding: 24px;
      }
      .card {
        padding: 16px;
        border: 1px solid #d8dde3;
        border-radius: 10px;
        background: #fff;
      }
      .card h3 {
        margin: 0 0 6px;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script>
      // Six cards alike: the same markup and text, no ids. render() builds them again from
      // nothing, as a framework re-render or the page's own reload does.
      const grid = document.getElementById('grid')
      window.render = () => {
        grid.innerHTML = ''
        for (let i = 0; i < 6; i++) {
          const card = document.createElement('div')
          card.className = 'card'
          card.innerHTML = '<h3>Plant</h3><p>$20</p>'
          grid.appendChild(card)
        }
      }
      render()
    </script>
  </body>
</html>
